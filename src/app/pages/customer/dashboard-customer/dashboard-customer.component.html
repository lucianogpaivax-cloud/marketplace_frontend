<div class="dashboard-container">

  <h1>Meu Painel</h1>

  <div class="cards-grid">

    <!-- Meus Dados -->
    <mat-card class="dashboard-card">
      <mat-card-header>
        <mat-icon mat-card-avatar>person</mat-icon>
        <mat-card-title>Meus Dados</mat-card-title>
        <mat-card-subtitle>Visualize e edite suas informações</mat-card-subtitle>
      </mat-card-header>
      
      <mat-card-actions>
        <button
          mat-raised-button
          color="primary"
          routerLink="/customer/edit"
        >
          Editar meus dados
        </button>
      </mat-card-actions>
    </mat-card>

    <!-- 🛒 NOVO CARD: MEUS PEDIDOS -->
    <mat-card class="dashboard-card">
      <mat-card-header>
        <mat-icon mat-card-avatar>shopping_bag</mat-icon>
        <mat-card-title>Meus Pedidos</mat-card-title>
        <mat-card-subtitle>Acompanhe suas compras</mat-card-subtitle>
      </mat-card-header>
      
      <mat-card-actions>
        <button
          mat-raised-button
          class="primary-btn"
          routerLink="/orders"
        >
          Ver pedidos
        </button>
      </mat-card-actions>
    </mat-card>

  </div>
</div>
